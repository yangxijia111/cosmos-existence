<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="1" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- 深空底 + 圆角 -->
  <rect width="64" height="64" rx="14" fill="#030308" />
  <!-- 奇点光晕 -->
  <circle cx="32" cy="32" r="24" fill="url(#coreGlow)" />
  <!-- 光核 -->
  <circle cx="32" cy="32" r="6" fill="#ede9fe" />
  <!-- 共动轨道弧（向一侧倾斜，暗示膨胀） -->
  <ellipse
    cx="32"
    cy="32"
    rx="26"
    ry="9.5"
    fill="none"
    stroke="#6ee7f0"
    stroke-opacity="0.45"
    stroke-width="1"
    transform="rotate(-24 32 32)"
  />
  <!-- 轨道上的粒子 -->
  <circle cx="53" cy="24.5" r="1.8" fill="#6ee7f0" />
  <circle cx="14" cy="41" r="1.2" fill="#fbbf24" />
</svg>
